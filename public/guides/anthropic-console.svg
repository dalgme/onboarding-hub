<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect width="760" height="480" rx="12" fill="#faf9f5"/>
  <rect x="0" y="0" width="760" height="40" rx="12" fill="#ece9e2"/>
  <circle cx="24" cy="20" r="6" fill="#d8d4c9"/><circle cx="44" cy="20" r="6" fill="#d8d4c9"/><circle cx="64" cy="20" r="6" fill="#d8d4c9"/>
  <rect x="90" y="8" width="420" height="24" rx="12" fill="#ffffff"/>
  <text x="104" y="24" font-size="13" fill="#6b6558">console.anthropic.com</text>
  <text x="530" y="24" font-size="11" fill="#c2410c">claude.ai 아님!</text>

  <rect x="40" y="70" width="170" height="380" rx="10" fill="#f2efe8"/>
