  <text x="314" y="175" font-size="13" font-weight="700" fill="#e11d48">먼저 가입</text>

  <text x="280" y="230" font-size="15" font-weight="700" fill="#3d3929">Billing — 크레딧 충전</text>
  <rect x="280" y="248" width="180" height="42" rx="8" fill="#ffffff" stroke="#e5e1d8"/>
  <text x="294" y="274" font-size="14" fill="#3d3929">카드 등록</text>
  <rect x="480" y="248" width="180" height="42" rx="8" fill="#c2410c" stroke="#e11d48" stroke-width="3"/>
  <text x="570" y="274" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">크레딧 충전 ($5~)</text>
  <circle cx="495" cy="315" r="13" fill="#e11d48"/>
  <text x="495" y="320" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="517" y="320" font-size="13" font-weight="700" fill="#e11d48">충전까지 해야 완료</text>

  <rect x="280" y="345" width="380" height="46" rx="8" fill="#fff7ed" stroke="#e11d48" stroke-width="3"/>
  <text x="294" y="364" font-size="13" font-weight="700" fill="#3d3929">Auto reload (자동 충전)</text>
  <text x="294" y="382" font-size="12" fill="#6b6558">잔액이 $5 아래로 내려가면 $20 자동 충전</text>
