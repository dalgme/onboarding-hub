  <circle cx="225" cy="167" r="13" fill="#e11d48"/>
  <text x="225" y="172" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="60" y="210" font-size="13" fill="#6b6558">Members</text>

  <rect x="250" y="70" width="470" height="380" rx="10" fill="#ffffff" stroke="#e5e1d8"/>
  <text x="280" y="115" font-size="19" font-weight="700" fill="#3d3929">가입하면 조직이 자동으로 생깁니다</text>
  <text x="280" y="142" font-size="13" fill="#6b6558">이메일 또는 Google 계정으로 가입</text>
  <circle cx="292" cy="170" r="13" fill="#e11d48"/>
