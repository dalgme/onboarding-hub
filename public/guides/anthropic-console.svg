  <circle cx="295" cy="415" r="13" fill="#e11d48"/>
  <text x="295" y="420" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="317" y="420" font-size="13" font-weight="700" fill="#e11d48">자동 충전 반드시 ON — 꺼두면 AI 기능이 멈춥니다</text>
